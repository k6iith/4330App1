<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Homework Tracker</h1>
            <p class="subtitle">Keep track of your weekly assignments</p>
        </header>

        <div class="add-section">
            <h2>Add Assignment</h2>
            <form id="assignment-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" placeholder="e.g. Math" required>
                    </div>
                    <div class="form-group">
                        <label for="due-date">Due Date</label>
                        <input type="date" id="due-date" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g. Chapter 5 problems 1-20" required>
                </div>
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <button type="submit" id="add-btn">Add Assignment</button>
            </form>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div id="assignments-list" class="assignments-list">
            <!-- assignments will be added here by JS -->
        </div>

        <div id="empty-state" class="empty-state">
            <p>No assignments yet. Add one above!</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
